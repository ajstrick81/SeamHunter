<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="seam-token" content="__SEAM_TOKEN__">
<title>SeamHunter</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/apps" aria-label="SeamHunter home">
      <img src="/static/tv.png" alt="" width="44" height="44">
      <span class="word"><span class="w1">Seam</span><span class="w2">Hunter</span></span>
    </a>
    <div class="brand-rule"></div>
    <div class="nav" id="nav">
      <a href="#/apps" data-nav="apps"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Apps</span></a>
      <a href="#/scan" data-nav="scan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 1.8v4M12 18.2v4M1.8 12h4M18.2 12h4"/></svg><span>Scan</span><i class="badge" id="scanBadge" hidden></i></a>
      <a href="#/explorer" data-nav="explorer"><svg viewBox="0 0 24 24"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5M13.5 4.5l-3 15"/></svg><span>Explorer</span></a>
      <a href="#/compare" data-nav="compare"><svg viewBox="0 0 24 24"><path d="M4 8h13M13.5 4.5 17 8l-3.5 3.5M20 16H7M10.5 12.5 7 16l3.5 3.5"/></svg><span>Compare</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg><span>Settings</span></a>
    </div>
    <div class="rail-foot">
      <div class="mini-job" id="miniJob" hidden></div>
      <div class="ver mono" id="ver">local · private</div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="drop-veil" id="dropVeil" hidden><div><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg><b>Drop to scan</b><span class="mono">.apkm · .apk · .xapk · .apks</span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
